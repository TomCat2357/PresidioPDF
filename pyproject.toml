[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "presidio-pdf"
version = "0.1.0"
description = "Japanese personal information detection and masking tool for PDF documents"
readme = "README.md"
# Python 3.14 を唯一のサポート対象とする（>=3.14,<3.15）。
# PII 検出は SudachiPy 直叩き、OCR は RapidOCR v3 に置き換え、
# 3.14 を阻んでいた spacy / presidio-analyzer / numpy==2.2.2(ndlocr由来) を撤去した。
# 全コア依存は cp314 wheel（sudachipy）または純 Python（sudachidict-core/
# phonenumbers/click/PyYAML）または cp310-abi3 wheel（PyMuPDF）を提供しており、
# ソースビルドなしで 3.14 に導入できる（2026-06 時点で PyPI 実 wheel を確認）。
requires-python = ">=3.14,<3.15"
# 最小限のデフォルト依存関係（CUIコア検出。OCR/GUI は extra）
dependencies = [
    # 基本的なCLI機能に必要な最小限のパッケージ
    "click>=8.1.0",
    # 形態素解析ベースの PII 検出（cp314 win_amd64 wheel あり）
    "sudachipy>=0.6.11",
    # Sudachi 標準辞書（py3-none-any のためインタプリタ非依存）
    "sudachidict-core>=20240409",
    # PyMuPDF 1.27 系の cp310-abi3 wheel が 3.14 で利用可能
    "PyMuPDF>=1.27.0",
    # PyYAML は 6.0.2 から cp314 wheel を提供
    "PyYAML>=6.0.2",
    # 電話番号の妥当性検証（純 Python。旧 presidio 経由→明示依存に）
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
# 開発用ツール（いずれも Python 3.13 対応版を下限に設定）
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    # black は 24.10.0 で Python 3.13 / target-version py313 をサポート
    "black>=24.10.0",
    "flake8>=7.0.0",
    # mypy は 1.13.0 で Python 3.13 typeshed をサポート
    "mypy>=1.13.0",
]

# GUI専用（PyQt6ベース）
gui = [
    # PyQt6 は cp310-abi3 wheel のため 3.14 で動作。6.11.0 を下限に設定
    "PyQt6>=6.11.0",
    "PyQt6-Qt6>=6.11.0",
]

# OCR拡張（RapidOCR v3）。依存(onnxruntime/opencv/numpy/shapely/pyclipper/Pillow)は
# すべて 3.14 対応（cp314 wheel もしくは abi3 wheel）。日本語認識は PP-OCRv4 を使用。
ocr = [
    "rapidocr>=3.8.1",
]

[project.scripts]
# New split command entrypoints
codex-read = "cli.read_main:main"
codex-detect = "cli.detect_main:main"
codex-duplicate-process = "cli.duplicate_main:main"
codex-mask = "cli.mask_main:main"
codex-run-config = "cli.run_config_main:main"

# PyQt GUI app
presidio-gui = "gui_pyqt.main:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py314']

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
